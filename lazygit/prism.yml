# Prism for lazygit, part of cosmic-prism-theme (MIT). Only the colours: your
# own ~/.config/lazygit/config.yml keeps the rest.
#
# Install: ./lazygit/install.sh puts this in ~/.config/lazygit/prism.yml and
# zsh/prism.zsh sets LG_CONFIG_FILE to "config.yml,prism.yml" so lazygit
# reads both (the later file wins). Without the zsh layer:
#   export LG_CONFIG_FILE="$HOME/.config/lazygit/config.yml,$HOME/.config/lazygit/prism.yml"
gui:
  theme:
    activeBorderColor:
      - "#F7C3C6"
      - bold
    inactiveBorderColor:
      - "#5A6B8C"
    searchingActiveBorderColor:
      - "#FFA69E"
      - bold
    optionsTextColor:
      - "#85CEC4"
    selectedLineBgColor:
      - "#161F33"
    inactiveViewSelectedLineBgColor:
      - "#0E1628"
    cherryPickedCommitFgColor:
      - "#060D1F"
    cherryPickedCommitBgColor:
      - "#D5EDEB"
    markedBaseCommitFgColor:
      - "#060D1F"
    markedBaseCommitBgColor:
      - "#6488EA"
    unstagedChangesColor:
      - "#E95C4B"
    defaultFgColor:
      - "#E0F7FA"
  authorColors:
    "*": "#D5EDEB"
