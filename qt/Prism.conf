# Prism colour scheme for qt5ct / qt6ct, part of cosmic-prism-theme (MIT).
# The rice's window colour for windows, its containers for buttons and
# tooltips, its text colour, the accent as highlight with the button text
# colour on it, dim placeholders.
#
# Install: ./qt/install.sh puts this in ~/.config/qt5ct/colors/ and
# ~/.config/qt6ct/colors/. Then in qt5ct / qt6ct: Appearance -> Color scheme
# -> Prism, Palette: Custom, Apply. Qt apps need QT_QPA_PLATFORMTHEME=qt5ct
# (or qt6ct) in the environment to read it.
#
# Roles, in order: WindowText, Button, Light, Midlight, Dark, Mid, Text,
# BrightText, ButtonText, Base, Window, Shadow, Highlight, HighlightedText,
# Link, LinkVisited, AlternateBase, NoRole, ToolTipBase, ToolTipText,
# PlaceholderText
[ColorScheme]
active_colors=#e0f7fa, #0e1628, #5a6b8c, #262e40, #030710, #161f33, #e0f7fa, #f6f8ff, #e0f7fa, #030710, #060d1f, #030710, #f7c3c6, #060d1f, #f7c3c6, #ffa69e, #0e1628, #060d1f, #0e1628, #e0f7fa, #8893b3
disabled_colors=#5a6b8c, #0e1628, #5a6b8c, #262e40, #030710, #161f33, #5a6b8c, #85cec4, #5a6b8c, #060d1f, #060d1f, #030710, #5a6b8c, #85cec4, #8893b3, #8893b3, #0e1628, #060d1f, #0e1628, #e0f7fa, #5a6b8c
inactive_colors=#e0f7fa, #0e1628, #5a6b8c, #262e40, #030710, #161f33, #e0f7fa, #f6f8ff, #e0f7fa, #030710, #060d1f, #030710, #f7c3c6, #060d1f, #f7c3c6, #ffa69e, #0e1628, #060d1f, #0e1628, #e0f7fa, #8893b3
