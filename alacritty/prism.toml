# Prism for Alacritty, part of cosmic-prism-theme (MIT).
# Colours follow the COSMIC Terminal scheme (cosmic-term/).
#
# Install: ./alacritty/install.sh puts this in ~/.config/alacritty/themes/,
# then in ~/.config/alacritty/alacritty.toml:
#   [general]
#   import = ["~/.config/alacritty/themes/prism.toml"]
# (Alacritty 0.13: a top-level `import = [...]` line instead.)

[colors.primary]
background = "#060D1F"
foreground = "#E0F7FA"
bright_foreground = "#F6F8FF"
dim_foreground = "#8893B3"

[colors.cursor]
text = "#060D1F"
cursor = "#F7C3C6"

[colors.vi_mode_cursor]
text = "#060D1F"
cursor = "#FFA69E"

[colors.selection]
text = "CellForeground"
background = "#262E40"

[colors.search.matches]
foreground = "#060D1F"
background = "#D5EDEB"

[colors.search.focused_match]
foreground = "#060D1F"
background = "#F7C3C6"

[colors.hints.start]
foreground = "#060D1F"
background = "#FFA69E"

[colors.hints.end]
foreground = "#060D1F"
background = "#D5EDEB"

[colors.footer_bar]
foreground = "#E0F7FA"
background = "#0E1628"

[colors.line_indicator]
foreground = "None"
background = "None"

[colors.normal]
black   = "#030710"
red     = "#E95C4B"
green   = "#6488EA"
yellow  = "#D5EDEB"
blue    = "#F7C3C6"
magenta = "#FFA69E"
cyan    = "#85CEC4"
white   = "#E1E9F5"

[colors.bright]
black   = "#5A6B8C"
red     = "#ED7D6F"
green   = "#83A0EE"
yellow  = "#EAF6F5"
blue    = "#FBDEE0"
magenta = "#FFCBC7"
cyan    = "#85CEC4"
white   = "#F6F8FF"

[colors.dim]
black   = "#060D1F"
red     = "#D32E1A"
green   = "#2558E1"
yellow  = "#9CD5D0"
blue    = "#51688E"
magenta = "#FF5B4C"
cyan    = "#61BFB2"
white   = "#A6AFC9"
