# Prism for kitty, part of cosmic-prism-theme (MIT).
# Colours follow the COSMIC Terminal scheme (cosmic-term/).
#
# Install: ./kitty/install.sh puts this in ~/.config/kitty/themes/, then in
# ~/.config/kitty/kitty.conf:
#   include themes/Prism.conf

foreground              #E0F7FA
background              #060D1F
selection_foreground    none
selection_background    #262E40

cursor                  #F7C3C6
cursor_text_color       #060D1F

url_color               #D5EDEB
url_style               curly

active_border_color     #F7C3C6
inactive_border_color   #5A6B8C
bell_border_color       #FFA69E

active_tab_foreground   #060D1F
active_tab_background   #F7C3C6
inactive_tab_foreground #85CEC4
inactive_tab_background #0E1628
tab_bar_background      #060D1F

mark1_foreground        #060D1F
mark1_background        #6488EA
mark2_foreground        #060D1F
mark2_background        #D5EDEB
mark3_foreground        #060D1F
mark3_background        #FFA69E

